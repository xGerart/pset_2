<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f3f46"/></marker>
    <style>
      .box{fill:#fff;stroke:#3f3f46;stroke-width:1.6;rx:10}
      .t{font-size:19px;font-weight:700;fill:#18181b}
      .s{font-size:14px;fill:#52525b}
      .lbl{font-size:13px;fill:#3f3f46;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .zone{font-size:15px;font-weight:700;fill:#71717a;letter-spacing:1px}
      .ln{stroke:#3f3f46;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>

  <!-- Fuentes -->
  <rect x="20" y="40" width="270" height="680" fill="#f4f4f5" rx="14"/>
  <text x="40" y="72" class="zone">FUENTES</text>
  <rect x="40" y="110" width="230" height="130" class="box"/>
  <text x="58" y="145" class="t">ERP (PostgreSQL)</text>
  <text x="58" y="170" class="s">VPS de producción</text>
  <text x="58" y="192" class="s">ventas, líneas, costos,</text>
  <text x="58" y="212" class="s">catálogo, sucursales</text>
  <rect x="40" y="290" width="230" height="110" class="box"/>
  <text x="58" y="325" class="t">API Nager.Date</text>
  <text x="58" y="350" class="s">feriados de Ecuador</text>
  <text x="58" y="372" class="s">(HTTPS, JSON)</text>
  <rect x="40" y="450" width="230" height="130" class="box"/>
  <text x="58" y="485" class="t">Seeds de negocio</text>
  <text x="58" y="600" class="s" style="font-size:13px">CSV versionados en dbt/seeds/</text>
  <text x="58" y="510" class="s">horarios, turnos,</text>
  <text x="58" y="532" class="s">correcciones de feriados,</text>
  <text x="58" y="554" class="s">eventos estacionales</text>

  <!-- Docker local -->
  <rect x="340" y="40" width="560" height="680" fill="#eef2ff" rx="14"/>
  <text x="360" y="72" class="zone">DOCKER COMPOSE (LOCAL)</text>
  <rect x="370" y="100" width="500" height="120" class="box"/>
  <text x="390" y="135" class="t">Kestra · orquestación</text>
  <text x="390" y="160" class="s">ingest_erp: cron 20:30 America/Guayaquil, retries exponenciales,</text>
  <text x="390" y="182" class="s">backfill · transform: trigger al terminar la ingesta (SUCCESS o WARNING)</text>
  <text x="390" y="204" class="s">metadatos en PostgreSQL · secretos SECRET_* (base64)</text>
  <rect x="370" y="290" width="500" height="150" class="box"/>
  <text x="390" y="325" class="t">pset2-runner (contenedor efímero)</text>
  <text x="390" y="350" class="s">extract_load.py: ssh → CSV → contrato de columnas</text>
  <text x="390" y="372" class="s">→ PUT + COPY INTO RAW → conciliación (LOAD_AUDIT)</text>
  <text x="390" y="394" class="s">dbt build: Bronze → Silver → Gold + 94 tests</text>
  <text x="390" y="416" class="s">imagen: Python 3.12 + dbt-snowflake 1.12</text>
  <rect x="370" y="510" width="500" height="150" class="box"/>
  <text x="390" y="545" class="t">Spark 3.5.7 · master + worker</text>
  <text x="390" y="570" class="s">build_obt.py (spark-submit desde Kestra)</text>
  <text x="390" y="592" class="s">lee GOLD con spark-snowflake 3.1.3</text>
  <text x="390" y="614" class="s">spine + joins + rezagos → valida → escribe OBT</text>
  <path d="M520,220 L520,288" class="ln dash"/><text x="530" y="260" class="lbl">lanza (docker.sock)</text>
  <path d="M760,220 C930,300 930,460 820,508" class="ln dash"/><text x="700" y="482" class="lbl">spark-submit (red pset2_default)</text>

  <!-- Snowflake -->
  <rect x="950" y="40" width="630" height="680" fill="#ecfeff" rx="14"/>
  <text x="970" y="72" class="zone">SNOWFLAKE · BASE PSET2 (WH XSMALL)</text>
  <g>
    <rect x="990" y="110" width="250" height="80" class="box"/><text x="1010" y="145" class="t">RAW</text><text x="1010" y="170" class="s">append-only, todo VARCHAR</text>
    <rect x="990" y="230" width="250" height="80" class="box"/><text x="1010" y="265" class="t">BRONZE</text><text x="1010" y="290" class="s">stg_* (tipos, hora local) + seeds</text>
    <rect x="990" y="350" width="250" height="80" class="box"/><text x="1010" y="385" class="t">SILVER</text><text x="1010" y="410" class="s">int_*: dedup, banderas, spine</text>
    <rect x="990" y="470" width="250" height="80" class="box"/><text x="1010" y="505" class="t">GOLD</text><text x="1010" y="530" class="s">star schema: 2 hechos + 5 dim.</text>
    <rect x="1300" y="470" width="250" height="80" class="box"/><text x="1320" y="505" class="t">OBT</text><text x="1320" y="530" class="s">sucursal × fecha × hora + audit</text>
    <path d="M1115,190 L1115,228" class="ln"/><path d="M1115,310 L1115,348" class="ln"/><path d="M1115,430 L1115,468" class="ln"/>
    <text x="1125" y="214" class="lbl">dbt</text><text x="1125" y="334" class="lbl">dbt</text><text x="1125" y="454" class="lbl">dbt</text>
  </g>
  <rect x="1300" y="110" width="250" height="130" fill="#fff" stroke="#a1a1aa" stroke-width="1.2" rx="10"/>
  <text x="1320" y="140" class="t" style="font-size:16px">Seguridad</text>
  <text x="1320" y="164" class="s">usuario TYPE=SERVICE</text>
  <text x="1320" y="186" class="s">par de llaves RSA, sin clave</text>
  <text x="1320" y="208" class="s">rol mínimo PSET2_ROLE</text>
  <text x="1320" y="230" class="s">resource monitor 20 créditos</text>

  <!-- Flujos entre zonas -->
  <path d="M270,175 L368,330" class="ln"/><text x="50" y="262" class="lbl">SSH forced command:</text>
  <text x="50" y="280" class="lbl">solo lectura, anonimizado</text>
  <path d="M270,345 L368,365" class="ln"/><text x="282" y="335" class="lbl">HTTPS</text>
  <path d="M270,515 L368,425" class="ln"/><text x="276" y="455" class="lbl">dbt seed</text>
  <path d="M870,340 C930,300 940,160 988,150" class="ln"/><text x="930" y="196" class="lbl">PUT/COPY</text>
  <path d="M870,400 C930,400 950,330 988,290" class="ln"/><text x="928" y="352" class="lbl">dbt build</text>
  <path d="M870,580 C930,560 960,520 988,512" class="ln"/><text x="905" y="545" class="lbl">lee GOLD</text>
  <path d="M870,640 C1100,700 1350,690 1425,552" class="ln"/><text x="1080" y="690" class="lbl">escribe OBT (overwrite)</text>
</svg>
