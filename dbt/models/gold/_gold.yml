version: 2

models:
  - name: dim_date
    description: Calendario con feriados (API + correcciones) y eventos estacionales.
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: dim_hour
    columns:
      - name: hour_key
        tests: [unique, not_null]
  - name: dim_branch
    columns:
      - name: branch_key
        tests: [unique, not_null]
      - name: experiment_role
        tests:
          - accepted_values:
              arguments:
                values: ['tratamiento', 'control', 'excluida']
  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: dim_salesperson
    columns:
      - name: salesperson_key
        tests: [unique, not_null]
      - name: salesperson_code
        tests: [unique]

  - name: fct_sales_lines
    description: "Grano: una línea de comprobante completado."
    columns:
      - name: sales_line_id
        tests: [unique, not_null]
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: hour_key
        tests:
          - relationships:
              arguments: {to: ref('dim_hour'), field: hour_key}
      - name: branch_key
        tests:
          - relationships:
              arguments: {to: ref('dim_branch'), field: branch_key}
      - name: product_key
        tests:
          - relationships:
              arguments: {to: ref('dim_product'), field: product_key}
      - name: salesperson_key
        tests:
          - relationships:
              arguments: {to: ref('dim_salesperson'), field: salesperson_key}
      - name: net_amount
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 0"}
      - name: cost_amount
        description: NULL cuando la línea no tiene costo real (conteo inicial).
      - name: quantity
        tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> 0"}

  - name: fct_store_hours
    description: "Grano: sucursal x fecha x hora abierta."
    columns:
      - name: store_hour_key
        tests: [unique, not_null]
      - name: date_key
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: hour_key
        tests:
          - relationships:
              arguments: {to: ref('dim_hour'), field: hour_key}
      - name: branch_key
        tests:
          - relationships:
              arguments: {to: ref('dim_branch'), field: branch_key}
