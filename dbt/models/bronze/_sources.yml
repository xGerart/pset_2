version: 2

sources:
  - name: erp
    description: ERP de la tienda (Postgres), extraído por Kestra vía SSH con consultas anonimizadas.
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: erp_vouchers
        description: Comprobantes de venta. Append-only con ventana de reproceso de 7 días (habrá ids repetidos).
      - name: erp_voucher_items
        description: Líneas de cada comprobante.
      - name: erp_batch_consumption
        description: Consumo de lotes por venta; trae el costo unitario.
      - name: erp_branches
        description: Snapshot diario de sucursales.
        config: {freshness: null}
      - name: erp_products
        description: Snapshot diario del catálogo.
        config: {freshness: null}
      - name: erp_categories
        config: {freshness: null}
      - name: erp_staff
        description: Snapshot del personal que vendió o cobró (sin nombres).
        config: {freshness: null}
      - name: load_audit
        description: Conciliación filas extraídas vs cargadas por corrida.
        config: {freshness: null}
  - name: nager
    description: API pública de feriados (date.nager.at), segunda fuente.
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: RAW
    tables:
      - name: nager_holidays
        config: {freshness: null}
